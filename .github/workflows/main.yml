name: Python

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - name: get rep
      uses: actions/checkout@v4
    - name: set python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - name: deps
      run: |
        python -m pip install --upgrade pip
        pip install requests
    - name: env
      env:
        OPEN_WEATHER_API_KEY: ${secrets.OPEN_WEATHER_API_KEY}
      run: |
        pip install pytest
        pytest
